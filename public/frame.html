<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CloudFrame</title>
<link rel=manifest href=/manifest.webmanifest><meta name=theme-color content="#000000"><link rel=icon href=/icon.svg><link rel=apple-touch-icon href=/icon.svg><meta name=apple-mobile-web-app-capable content=yes><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-title content=CloudFrame>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;cursor:none}body.ui{cursor:default}
.s{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.5s}.s.on{opacity:1}
.b{position:absolute;margin:3vmin;padding:1.6vmin 2.2vmin;border-radius:2.4vmin;background:rgba(0,0,0,var(--o,.35));
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;text-shadow:0 1px 3px #0008;max-width:42vw}
.tl{top:0;left:0}.tr{top:0;right:0;text-align:right}.bl{bottom:0;left:0}.br{bottom:0;right:0;text-align:right}
.t{font-size:5vmin;font-weight:600;line-height:1.15}.m{font-size:2.2vmin;opacity:.92}
#cb{position:fixed;left:50%;bottom:2.5vmin;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:16px;
background:rgba(0,0,0,.6);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
body.ui #cb{opacity:1;pointer-events:auto}
#cb>*,#mg>*{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;text-decoration:none;cursor:pointer}
#mg{display:contents}#mg[hidden]{display:none}#mv{width:90px;padding:0;min-height:0;vertical-align:middle}#mt{max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
#dim{position:fixed;left:0;top:0;width:100%;height:100%;background:#000;opacity:0;pointer-events:none;transition:opacity 3s;z-index:1}#ov .b{z-index:2}
.c{left:50%;top:50%;margin:0;transform:translate(-50%,-50%);max-width:90vw;text-align:center;padding:3.5vmin 6vmin}.c .t{font-size:17vmin}.c .m{font-size:4.4vmin}
.c .tm{margin-top:2vmin;padding-top:2vmin;border-top:1px solid rgba(255,255,255,.25);font-size:3.6vmin;opacity:.92}.pd{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.4em}
</style></head><body>
<img class=s id=a alt=""><img class=s id=b alt=""><video class=s id=vd playsinline muted preload=auto></video><div id=dim></div><div id=ov></div>
<div id=cb><button id=pv>‹</button><button id=pp>❚❚</button><button id=nx>›</button><select id=fa></select><select id=ct title="Show"><option value="">Auto</option><option value=all>Photos &amp; videos</option><option value=photos>Photos</option><option value=videos>Videos</option></select><span id=mg hidden><button id=mu title="Music on/off">🔊</button><button id=mn title="Next track">⏭</button><input id=mv type=range min=0 max=1 step=.05 title=Volume><span id=mt></span></span><button id=fs title="Fullscreen (F)">⛶</button><span id=lx hidden></span><a id=lt href="/lite">Lite</a><a id=ad href="/admin" hidden>Admin</a><button id=lo>Log out</button></div>
<script>
let S={},P=[],O=[],i=-1,cur=0,now=null,Wx=null,wk='',wt=0,paused=false,T,me='frame',ut,au=new Audio(),TR=[],ti=-1,muted=localStorage.mute=='1',errs=0,wok=0,vidActive=false,vT=[],mPaused=false,PS=null,pt=0,pk='',musicOff=false,lux=null,ls=null,lsTried=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const PC={Good:'#4cc38a',Moderate:'#4da3ff',Unhealthy:'#f5d33f','Very unhealthy':'#f59e42',Hazardous:'#ef5350'};
const WM={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',73:'Snow',75:'Heavy snow',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
async function api(p){const r=await fetch(p);if(r.status==401){location='/login?mode=frame';throw 0}return r.json()}
async function weather(){if(S.lat===''||S.lon==='')return Wx=null;
try{const r=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(S.lat)}&longitude=${encodeURIComponent(S.lon)}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=2&timezone=auto&temperature_unit=${S.units=='F'?'fahrenheit':'celsius'}`)).json();
const dl=r.daily||{};Wx={t:Math.round(r.current.temperature_2m),c:WM[r.current.weather_code]||'',tm:dl.time&&dl.time.length>1?{c:WM[dl.weather_code[1]]||'',hi:Math.round(dl.temperature_2m_max[1]),lo:Math.round(dl.temperature_2m_min[1]),p:dl.precipitation_probability_max?dl.precipitation_probability_max[1]:null}:null};wok=Date.now()}catch{}}
async function load(){S=await api('/api/settings');const hid=S.hide_albums||[],al=await api('/api/albums');
const AL=[...al.albums,{id:'none',name:'Unsorted'}].filter(a=>!hid.includes(a.id)),fa=$('fa');let fl=localStorage.fa||'all';
if(fl!='all'&&!AL.some(a=>a.id==fl))fl='all';
const h='<option value=all>All albums</option>'+AL.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
if(fa.innerHTML!=h)fa.innerHTML=h;fa.value=localStorage.fa=fl;
const ct=localStorage.ct||S.content,all=await api('/api/photos');syncSW(all.filter(x=>x.kind!='video'&&!hid.includes(x.album_id||'none')).map(x=>x.id));
const p=all.filter(x=>{const k=x.album_id||'none';return !hid.includes(k)&&(fl=='all'||k==fl)&&(ct=='all'||(ct=='photos')==(x.kind!='video'))});
if(p.length!=P.length||p.some((x,k)=>x.id!=P[k].id)){P=p;O=[...P.keys()];if(S.order=='shuffle')O.sort(()=>Math.random()-.5);i=-1;
if(P.length)show(0);else{$('a').classList.remove('on');$('b').classList.remove('on');now=null}}
const k=S.lat+S.lon+S.units;if(k!=wk||Date.now()-wt>9e5){wk=k;wt=Date.now();weather()}
if(S.show_psi){if(Date.now()-pt>9e5||pk!=S.psi_region){pt=Date.now();pk=S.psi_region;api('/api/psi').then(d=>{PS=d&&typeof d.v=='number'?Object.assign(d,{got:Date.now()}):null;draw()}).catch(()=>{})}}else PS=null;
initLS();draw();music()}
function show(k){if(!P.length)return;clearV();i=((k%O.length)+O.length)%O.length;const p=P[O[i]];if(p.kind=='video')return playV(p);$('vd').classList.remove('on');const el=$(cur?'a':'b'),old=$(cur?'b':'a');
el.style.objectFit=old.style.objectFit=S.fit;el.onload=()=>{el.classList.add('on');old.classList.remove('on');cur^=1;now=p;draw()};el.src='/api/photo/'+p.id}
const next=()=>show(i+1);
function loop(){clearTimeout(T);T=setTimeout(()=>{if(!paused&&!vidActive)next();loop()},(S.interval||15)*1e3)}
// optional: dim the screen in software using the device's ambient light sensor (only some Chromium/Android devices expose one)
function initLS(){const lx=$('lx');
if(!S.light_sensor){if(ls){try{ls.stop()}catch(e){}ls=null}lux=null;lsTried=false;lx.hidden=true;return}
if(lsTried)return;lsTried=true;lx.hidden=false;
if(!('AmbientLightSensor' in window)){lx.textContent='No light sensor';return}
try{ls=new AmbientLightSensor({frequency:1});ls.onreading=()=>{lux=ls.illuminance;lx.textContent='☀ '+Math.round(lux)+' lx';draw()};
ls.onerror=()=>{lx.textContent='Light sensor unavailable';lux=null;draw()};ls.start()}catch(e){lx.textContent='Light sensor unavailable'}}
// sleep hours: dim the photos and show a large clock (uses the timezone from Display settings)
function slp(){if(!S.sleep_on||S.sleep_start==S.sleep_end)return false;let tz=S.tz;try{new Intl.DateTimeFormat(0,{timeZone:tz})}catch{tz=undefined}
const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),g=t=>+p.find(x=>x.type==t).value,m=g('hour')*60+g('minute'),a=S.sleep_start.split(':'),b=S.sleep_end.split(':'),s=+a[0]*60+ +a[1],e=+b[0]*60+ +b[1];
return s<e?(m>=s&&m<e):(m>=s||m<e)}
function draw(){const o=$('ov'),sl=slp();const sb=sl?(S.sleep_level??5)/100:(S.light_sensor&&lux!=null?Math.min(1,Math.max((S.light_min??25)/100,Math.log10(lux+1)/Math.log10(251))):1);$('dim').style.opacity=1-sb;
const mo=sl&&S.sleep_music_off;if(mo!==musicOff){musicOff=mo;if(mo)au.pause();else if(S.music&&!muted&&TR.length)au.src?au.play().catch(()=>{}):playNext()}o.style.setProperty('--o',S.opacity);
if(!P.length){o.innerHTML='<div class="b bl"><div class=m>No photos to show'+(me=='admin'?' – <a href="/admin#photos" style="color:#8ab4ff">add some</a>':'')+'</div></div>';return}
if(!S.overlay){o.innerHTML='';return}
let tz=S.tz;try{new Intl.DateTimeFormat(0,{timeZone:tz})}catch{tz=undefined}
const d=new Date(),f=x=>new Intl.DateTimeFormat(undefined,{timeZone:tz,...x}).format(d),F={};
if(S.show_time)F.time=`<div class=t>${f({hour:'2-digit',minute:'2-digit',hour12:!S.h24})}</div>`;
if(S.show_date)F.date=`<div class=m>${f({weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>`;
const W=Date.now()-wok<72e5?Wx:null; // hide stale weather after 2h offline
if(S.show_temp&&W)F.temp=`<div class=t>${W.t}°${S.units}</div>`;
if(S.show_weather&&W&&W.c)F.w=`<div class=m>${W.c}</div>`;
if(S.show_psi&&PS&&Date.now()-PS.got<144e5)F.psi=`<div class=m><span class=pd style="background:${PC[PS.band]}"></span>PSI ${PS.v} · ${PS.band}</div>`;
if(S.show_meta&&now){if(now.caption)F.cap=`<div class=m>${esc(now.caption)}</div>`;
const t=now.taken_at&&new Date(now.taken_at);if(t&&!isNaN(t))F.tk=`<div class=m>Taken ${t.toLocaleDateString(undefined,{dateStyle:'medium'})}</div>`;
F.n=`<div class=m>${now.kind=='video'?'Video':'Photo'} ${i+1} of ${P.length}</div>`}
if(sl){const wl=[S.show_weather&&W&&W.c,S.show_temp&&W&&W.t+'°'+S.units].filter(Boolean).join(' · ');
const tm=W&&W.tm&&(S.show_weather||S.show_temp)?`<div class=tm>Tomorrow: ${S.show_weather?W.tm.c+' ':''}${S.show_temp?W.tm.lo+'°/'+W.tm.hi+'°'+S.units:''}${S.show_weather&&W.tm.p!=null?' · '+W.tm.p+'% rain':''}</div>`:'';
o.innerHTML=`<div class="b c">${F.time||''}${F.date||''}${wl?`<div class=m style="margin-top:1vmin">${wl}</div>`:''}${F.psi||''}${tm}</div>`;return}
const G=S.position=='split'?{tl:['time','date'],tr:['temp','w','psi'],bl:['cap'],br:['tk','n']}:{[S.position]:['time','date','temp','w','psi','cap','tk','n']};
o.innerHTML=Object.entries(G).map(([c,ks])=>{const h=ks.map(k=>F[k]||'').join('');return h?`<div class="b ${c}">${h}</div>`:''}).join('')}
// ---- video slides: play to the end (or max seconds), then move on; skip if it stalls or fails
function clearV(){vidActive=false;vT.forEach(clearTimeout);vT=[];const v=$('vd');v.onended=v.onerror=v.oncanplay=null;v.pause();
if(mPaused){mPaused=false;if(!muted&&!musicOff)au.play().catch(()=>{})}}
function skipV(){if(!vidActive)return;next();loop()}
function playV(p){const v=$('vd');vidActive=true;now=p;v.style.objectFit=S.fit;v.muted=!S.video_sound;
if(S.video_sound&&S.music&&!au.paused){au.pause();mPaused=true}
v.src='/api/video/'+p.id;
v.oncanplay=()=>{v.oncanplay=null;if(!vidActive)return;$('a').classList.remove('on');$('b').classList.remove('on');v.classList.add('on');draw();
if(paused)return;const pr=v.play();pr&&pr.catch&&pr.catch(()=>{v.muted=true;v.play().catch(skipV)})};
v.onended=skipV;v.onerror=skipV;
vT=[setTimeout(()=>{if(vidActive&&v.currentTime<.1&&!paused)skipV()},9000),setTimeout(skipV,(S.video_max>0&&S.video_max<p.duration?S.video_max+2:p.duration+10)*1e3)]}
// controls
const showUI=()=>{document.body.classList.add('ui');clearTimeout(ut);ut=setTimeout(()=>document.body.classList.remove('ui'),3e3)};
['pointermove','pointerdown'].forEach(e=>addEventListener(e,showUI));
const de=document.documentElement,fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement,fsCan=!!(de.requestFullscreen||de.webkitRequestFullscreen);
const fsT=()=>{if(!fsCan)return alert('Fullscreen is not available in this browser. On iPad or iPhone, use Share > Add to Home Screen and open CloudFrame from the Home Screen.');
if(fsOn())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else{const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de);p&&p.catch&&p.catch(()=>{})}};
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,()=>$('fs').textContent=fsOn()?'✕':'⛶'));
addEventListener('dblclick',e=>{if(!e.target.closest('#cb'))fsT()});
const pp=()=>{paused=!paused;$('pp').textContent=paused?'▶':'❚❚';if(vidActive){paused?$('vd').pause():$('vd').play().catch(()=>{})}};
$('nx').onclick=()=>{next();loop()};$('pv').onclick=()=>{show(i-1);loop()};$('pp').onclick=pp;$('fs').onclick=fsT;
$('fa').onchange=()=>{localStorage.fa=$('fa').value;load()};
$('ct').value=localStorage.ct||'';$('ct').onchange=()=>{localStorage.ct=$('ct').value;load()};
$('lo').onclick=async()=>{await fetch('/api/logout').catch(()=>{});await Promise.all((await caches.keys()).map(k=>caches.delete(k)));location='/login'};
addEventListener('keydown',e=>{showUI();if(e.key=='f')fsT();if(e.key=='ArrowRight'){next();loop()}if(e.key=='ArrowLeft'){show(i-1);loop()}if(e.key==' ')pp()});
let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60){d<0?next():show(i-1);loop()}},{passive:true});
async function wl(){try{await navigator.wakeLock?.request('screen')}catch{}}
addEventListener('click',e=>{wl();if(!e.target.closest('#cb')&&!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{})},{once:true});
document.addEventListener('visibilitychange',()=>document.visibilityState=='visible'&&wl());
// ---- offline cache (service worker) and background music
const syncSW=ids=>navigator.serviceWorker?.ready.then(r=>r.active?.postMessage({type:'sync',ids})).catch(()=>{});
navigator.serviceWorker?.register('/sw.js').catch(()=>{});
async function music(){au.volume=localStorage.vol!=null?+localStorage.vol:(S.music_volume??.5);$('mv').value=au.volume;$('mg').hidden=!S.music;
if(!S.music){au.pause();return}
let t=[];try{t=(await api('/api/music')).map(x=>x.name)}catch{return}
if(t.slice().sort().join('|')!=[...TR].sort().join('|')){TR=t;if(S.music_shuffle)TR.sort(()=>Math.random()-.5);ti=-1;au.pause();au.removeAttribute('src')}
if(TR.length&&au.paused&&!muted&&!musicOff)au.src?au.play().catch(()=>{}):playNext()}
function playNext(){if(!TR.length||muted||musicOff)return;ti=(ti+1)%TR.length;au.src='/api/music/'+encodeURIComponent(TR[ti]);au.play().catch(()=>{})}
au.onended=playNext;au.onplaying=()=>{errs=0;$('mt').textContent=(TR[ti]||'').replace(/\.[^.]+$/,'')};au.onerror=()=>{if(++errs<=TR.length)setTimeout(playNext,1500)};
const unlock=()=>{if(S.music&&au.paused&&!muted&&!musicOff&&TR.length)au.src?au.play().catch(()=>{}):playNext()};
['pointerdown','keydown','touchend'].forEach(e=>addEventListener(e,unlock));
$('mu').textContent=muted?'🔇':'🔊';
$('mu').onclick=()=>{muted=!muted;localStorage.mute=muted?'1':'0';$('mu').textContent=muted?'🔇':'🔊';muted?au.pause():unlock()};
$('mn').onclick=()=>{muted=false;localStorage.mute='0';$('mu').textContent='🔊';playNext()};
$('mv').oninput=()=>{au.volume=+$('mv').value;localStorage.vol=$('mv').value};
fetch('/api/me').then(r=>r.json()).then(d=>{me=d.scope;$('ad').hidden=me!='admin';draw()}).catch(()=>{});
load().catch(()=>{}).finally(loop);setInterval(()=>load().catch(()=>{}),6e4);setInterval(draw,1e3);
</script></body></html>
