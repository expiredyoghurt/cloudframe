<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CloudFrame – Sign in</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14161a;color:#e8e8ea;font:16px system-ui}
form{background:#1d2026;padding:26px;border-radius:18px;width:min(330px,86vw);display:grid;gap:12px}
h1{margin:0;font-size:22px}small{opacity:.5}
.tg{display:grid;grid-template-columns:1fr 1fr;background:#2a2f38;border-radius:12px;padding:3px}
.tg button{background:none;border:0;border-radius:10px;padding:9px;color:inherit;font:inherit;cursor:pointer}.tg .on{background:#3b6ef5}
input,#go{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid #3a404c;background:#2a2f38;color:inherit}
#go{background:#3b6ef5;border-color:#3b6ef5;cursor:pointer}#go:disabled{opacity:.5}
p{margin:0;min-height:1.2em;color:#ff8a8a;font-size:14px}
</style></head><body>
<form id=f><h1>CloudFrame <small>v1.5</small></h1>
<div class=tg><button type=button data-m=admin>Admin</button><button type=button data-m=frame>Open frame</button></div>
<input name=username placeholder=Username autocomplete=username required>
<input name=password id=pw type=password placeholder=Password autocomplete=current-password required>
<input name=pin type=password inputmode=numeric pattern="\d{8}" maxlength=8 placeholder="8-digit PIN" required>
<button id=go>Sign in</button><p id=e></p></form>
<script>
const $=id=>document.getElementById(id);let mode=new URLSearchParams(location.search).get('mode')||localStorage.pfm||'admin',tm;
function setMode(m){mode=localStorage.pfm=m;document.querySelectorAll('.tg button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));
$('pw').hidden=m=='frame';$('pw').required=$('pw').disabled=m=='frame';$('go').textContent=m=='frame'?'Start frame':'Sign in'}
document.querySelector('.tg').onclick=e=>e.target.dataset.m&&setMode(e.target.dataset.m);setMode(mode);
function lock(s){clearInterval(tm);$('go').disabled=true;tm=setInterval(()=>{if(s<=0){clearInterval(tm);$('go').disabled=false;$('e').textContent='';return}
$('e').textContent=`Too many attempts. Try again in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;s--},1e3)}
f.onsubmit=async e=>{e.preventDefault();const b={...Object.fromEntries(new FormData(f)),mode};
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json().catch(()=>({}));
if(r.ok)return location=d.next;if(r.status==429)return lock(d.retry||60);$('e').textContent='Invalid credentials'}
</script></body></html>
